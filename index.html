        .section-title .dot{width:20px;height:20px;border-radius:6px;background:#1e232e;border:1px solid #2e3442;display:grid;place-items:center}

        input, select, textarea{width:100%;background:#1e232e;border:1px solid #2e3442;border-radius:10px;padding:10px 12px;font:13.5px/1.35 'Inter', sans-serif;color:#e6e8ec;outline:none;transition:all 0.18s ease}
        input::placeholder, textarea::placeholder{color:#5a647a}
        input:focus, select:focus, textarea:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.18), 0 0 18px rgba(59,130,246,0.12);background:#222836}
        textarea{min-height:72px;resize:vertical}
        .wide{grid-column:1 / -1}
        .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid #232833;align-items:center}
        button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700;font-size:13.5px;letter-spacing:-0.01em;transition:all .18s ease;display:inline-flex;align-items:center;gap:8px}

<script>
(function () {
  'use strict';
  const STORAGE_KEY = 'gerador-etiqueta-ti-dark:v1';
  const FIELD_IDS = [
    'data', 'tipo', 'responsavel', 'novo-tecnico', 'patrimonio', 'sistema',
    'hostname', 'unidade', 'ram', 'ssd', 'processador', 'ip', 'hardware-extra'
  ];
  let restored = false;
  let saveTimer;

  function readFields() {
    const values = {};
    FIELD_IDS.forEach((id) => {
      const field = document.getElementById(id);
      if (field) values[id] = field.value;
    });
    return values;
  }

  function saveFields() {
    if (!restored) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(readFields()));
    } catch (error) {
      console.warn('Não foi possível salvar os dados desta etiqueta neste navegador.', error);
    }
  }

  function restoreFields() {
    if (restored) return;
    const form = document.getElementById('form');
    if (!form || !document.getElementById('label')) return;
    restored = true;
    let saved = {};
    try {
      saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {};
    } catch (error) {
      console.warn('Os dados salvos da etiqueta não puderam ser lidos.', error);
    }

    const applySavedValues = () => {
      FIELD_IDS.forEach((id) => {
        const value = saved[id];
        const field = document.getElementById(id);
        if (value === undefined || !field || field.value === value) return;
        const prototype = field instanceof HTMLSelectElement ? HTMLSelectElement.prototype
          : field instanceof HTMLTextAreaElement ? HTMLTextAreaElement.prototype
          : HTMLInputElement.prototype;
        const setter = Object.getOwnPropertyDescriptor(prototype, 'value')?.set;
        if (setter) setter.call(field, value);
        else field.value = value;
        field.dispatchEvent(new Event(field instanceof HTMLSelectElement ? 'change' : 'input', { bubbles: true }));
      });
    };
    applySavedValues();
    // O segundo passe restaura campos condicionais que aparecem após trocar o técnico para "novo".
    setTimeout(applySavedValues, 100);
    setTimeout(saveFields, 200);
  }

  function downloadLabelHtml() {
    saveFields();
    const label = document.getElementById('label');
    if (!label) return;
    const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiqueta de TI - ${new Date().toLocaleDateString('pt-BR')}</title>
<style>
@page { size: 100mm 80mm; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100mm; height: 80mm; background: #fff; }
#label { width: 100mm; height: 80mm; background: white; color: #000; border: 1px solid #000; padding: 3.5mm; overflow: hidden; font-family: Arial, sans-serif; display: flex; flex-direction: column; }
.label-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1.2px solid #000; padding-bottom: 1.5mm; gap: 3mm; }
.label-title { font-size: 15pt; font-weight: 900; letter-spacing: .4px; }
.label-tag { font-size: 7pt; font-weight: bold; border: 1px solid #000; padding: 1mm 1.5mm; white-space: nowrap; }
.label-body { display: grid; grid-template-columns: 1fr 1fr; column-gap: 4mm; row-gap: 1.5mm; padding-top: 2mm; flex: 1; align-content: start; }
.item { min-width: 0; }
.k { font-size: 6.5pt; font-weight: bold; text-transform: uppercase; letter-spacing: .25px; }
.v { font-size: 9pt; font-weight: 600; overflow-wrap: anywhere; line-height: 1.15; min-height: 3.5mm; }
.item.full { grid-column: 1 / -1; }
.item.full .v { font-size: 8pt; }
.label-foot { border-top: 1px solid #000; padding-top: 1.2mm; display: flex; justify-content: space-between; gap: 2mm; font-size: 6.5pt; }
@media print {
  html, body { width:100mm; height:80mm; min-height:80mm; max-height:80mm; margin:0; padding:0; overflow:hidden; }
  #label { position:fixed; left:0; top:0; width:100mm; height:80mm; margin:0; border:0; page-break-after:avoid; break-after:avoid-page; break-inside:avoid; }
}
</style>
</head>
<body>${label.outerHTML}</body>
</html>`;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `etiqueta-ti-${new Date().toISOString().slice(0, 10)}.html`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function addActionButtons() {
    const actions = document.querySelector('.actions');
    if (!actions || actions.dataset.persistenceReady) return;
    actions.dataset.persistenceReady = 'true';

    const printButton = document.createElement('button');
    printButton.type = 'button';
    printButton.className = 'primary';
    printButton.style.cssText = 'background:linear-gradient(135deg,#175cd3,#4f46e5);color:#fff;border:1px solid #3567df';
    printButton.textContent = 'Imprimir etiqueta';
    printButton.addEventListener('click', () => {
      saveFields();
      window.print();
    });

    const saveButton = document.createElement('button');
    saveButton.type = 'button';
    saveButton.className = 'secondary';
    saveButton.textContent = 'Salvar etiqueta em HTML';
    saveButton.title = 'Baixa um arquivo HTML independente com esta etiqueta preenchida';
    saveButton.addEventListener('click', downloadLabelHtml);

    actions.insertBefore(printButton, actions.firstChild);
    actions.insertBefore(saveButton, printButton.nextSibling);
  }

  function watchApp() {
    const observer = new MutationObserver(() => {
      addActionButtons();
      restoreFields();
    });
    observer.observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
    addActionButtons();
    restoreFields();
  }

  document.addEventListener('input', (event) => {
    if (event.target && event.target.closest && event.target.closest('#form')) {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveFields, 150);
    }
  }, true);
  document.addEventListener('change', (event) => {
    if (event.target && event.target.closest && event.target.closest('#form')) {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveFields, 50);
    }
  }, true);
  document.addEventListener('click', (event) => {
    if (event.target && event.target.closest && event.target.closest('#clear')) {
      setTimeout(saveFields, 100);
    }
  }, true);
  window.addEventListener('beforeprint', saveFields);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watchApp);
  else watchApp();
})();
</script>
